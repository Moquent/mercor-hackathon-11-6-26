# docker compose up console          the live console on http://127.0.0.1:8080/ (bound to localhost only)
# docker compose run --rm bench      the full offline evaluation in an isolated container, then exit
# docker compose run --rm gate       the regression gate
services:
  console:
    build: .
    env_file: [.env]          # OPENAI / TYPESAFE keys, only needed for live runs and drafting
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./attempts:/app/attempts
      - ./results:/app/results
      - ./cases:/app/cases
  bench:
    build: .
    profiles: [batch]
    command: ["python", "-m", "rootproof", "evaluate"]
    volumes:
      - ./results:/app/results
  gate:
    build: .
    profiles: [batch]
    command: ["python", "-m", "unittest", "tests/test_regression.py", "-v"]
