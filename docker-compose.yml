# Host ports 5433/6380 avoid clashing with a natively installed Postgres/Redis.
x-app: &app
  build: .
  image: dagscope:local
  environment: &env
    DATABASE_URL: postgresql+psycopg://dagscope:dagscope@postgres:5432/dagscope
    REDIS_URL: redis://redis:6379/0
    GATEWAY_URL: http://gateway:8000
    ORDERS_URL: http://orders:8001
    INVENTORY_URL: http://inventory:8002
    VERIFIER_URL: http://verifier:8003

x-depends: &depends
  init:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dagscope
      POSTGRES_PASSWORD: dagscope
      POSTGRES_DB: dagscope
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagscope -d dagscope"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot schema creation; every service waits for it to exit 0.
  init:
    <<: *app
    command: python -m app.database.session
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *app
    command: uvicorn app.gateway.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      <<: *depends
      orders:
        condition: service_healthy
    healthcheck: &http_health
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8000/health',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  orders:
    <<: *app
    command: uvicorn app.orders.main:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
    depends_on: *depends
    healthcheck:
      <<: *http_health
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8001/health',timeout=2)"]

  inventory:
    <<: *app
    command: uvicorn app.inventory.main:app --host 0.0.0.0 --port 8002
    ports: ["8002:8002"]
    depends_on: *depends
    healthcheck:
      <<: *http_health
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8002/health',timeout=2)"]

  worker:
    <<: *app
    command: python -m app.workers.main
    depends_on:
      <<: *depends
      inventory:
        condition: service_healthy

  verifier:
    <<: *app
    command: uvicorn app.verifier.service:app --host 0.0.0.0 --port 8003
    ports: ["8003:8003"]
    depends_on: *depends
    healthcheck:
      <<: *http_health
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8003/health',timeout=2)"]

  dashboard:
    <<: *app
    command: streamlit run app/dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false --client.toolbarMode minimal
    ports: ["8501:8501"]
    environment:
      <<: *env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
    volumes:
      - ./benchmark:/srv/benchmark
    depends_on:
      <<: *depends
      gateway:
        condition: service_healthy
      verifier:
        condition: service_healthy
